<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Dark Teal Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#14b8a6" stroke-width="8" />

  <!-- Medical Cross Base -->
  <g filter="url(#glow)">
    <path d="M 216 112 H 296 V 216 H 400 V 296 H 296 V 400 H 216 V 296 H 112 V 216 H 216 Z" 
          fill="url(#crossGrad)" 
          rx="24" 
          stroke="#34d399" 
          stroke-width="6" />
  </g>

  <!-- AI Signal Network Nodes -->
  <g fill="#a7f3d0" stroke="#047857" stroke-width="2">
    <circle cx="216" cy="160" r="8" />
    <circle cx="296" cy="160" r="8" />
    <circle cx="350" cy="216" r="8" />
    <circle cx="350" cy="296" r="8" />
    <circle cx="162" cy="216" r="8" />
    <circle cx="162" cy="296" r="8" />
    <line x1="216" y1="160" x2="296" y2="160" stroke="#6ee7b7" stroke-width="3" />
    <line x1="296" y1="160" x2="350" y2="216" stroke="#6ee7b7" stroke-width="3" />
    <line x1="162" y1="216" x2="216" y2="160" stroke="#6ee7b7" stroke-width="3" />
  </g>

  <!-- Red Pulse Heartbeat Line -->
  <path d="M 90 256 L 180 256 L 205 190 L 230 330 L 260 170 L 285 290 L 310 230 L 330 256 L 422 256" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
</svg>
