# Firebase App Hosting Configuration
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_MAP_PROVIDER
    value: "google"
  - variable: DEMO_MODE
    value: "false"
  # Set secret environment variables in Firebase Console or Google Secret Manager:
  # - GEMINI_API_KEY
  # - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
